<!doctype html>
<html lang="en" data-theme="day">
<head><meta charset="utf-8"><title>StatBar — Cozy Game World</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../tokens/tokens.css">
<link rel="stylesheet" href="../bundle.css">
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="../bundle.js"></script>
</head>
<body>
<!-- Standalone example of the StatBar component. Change data-theme on <html> to dusk or night to see the other themes. -->
<div id="root" class="cz-row"></div>
<script>
  var C = window.Cozy, h = React.createElement;
  var r = h('div', { className: 'cz-col', style: { padding: 0 } }, h(C.StatBar, { label: 'Curiosity', value: 9 }), h(C.StatBar, { label: 'Design', value: 7, tone: 'terracotta-500' }), h(C.StatBar, { label: 'Code', value: 6, tone: 'sage-400' }), h(C.StatBar, { label: 'Patience', value: 4, tone: 'sky-300' }));
  ReactDOM.createRoot(document.getElementById('root')).render(r);
</script>
</body>
</html>
