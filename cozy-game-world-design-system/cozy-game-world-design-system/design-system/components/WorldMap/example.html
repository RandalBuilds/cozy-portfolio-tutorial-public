<!doctype html>
<html lang="en" data-theme="day">
<head><meta charset="utf-8"><title>WorldMap — Cozy Game World</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../tokens/tokens.css">
<link rel="stylesheet" href="../bundle.css">
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="../bundle.js"></script>
</head>
<body>
<!-- Standalone example of the WorldMap component. Change data-theme on <html> to dusk or night to see the other themes. -->
<div id="root" class="cz-row"></div>
<script>
  var C = window.Cozy, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(C.WorldMap, { current: 'home', locations: [{ id: 'home', label: 'Home', icon: 'home', x: 18, y: 66 }, { id: 'workshop', label: 'Workshop', icon: 'projects', x: 40, y: 30 }, { id: 'library', label: 'Library', icon: 'book', x: 64, y: 60 }, { id: 'mailbox', label: 'Mailbox', icon: 'mail', x: 84, y: 28 }] }));
</script>
</body>
</html>
