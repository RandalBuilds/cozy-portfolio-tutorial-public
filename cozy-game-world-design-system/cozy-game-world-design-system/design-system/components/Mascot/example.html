<!doctype html>
<html lang="en" data-theme="day">
<head><meta charset="utf-8"><title>Mascot — Cozy Game World</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../tokens/tokens.css">
<link rel="stylesheet" href="../bundle.css">
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="../bundle.js"></script>
</head>
<body>
<!-- Standalone example of the Mascot component. Change data-theme on <html> to dusk or night to see the other themes. -->
<div id="root" class="cz-row"></div>
<script>
  var C = window.Cozy, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null, h(C.Mascot, { mood: 'idle' }), h(C.Mascot, { mood: 'wave' }), h(C.Mascot, { mood: 'happy' }), h(C.Mascot, { mood: 'sleepy' }), h(C.Mascot, { mood: 'talking' })));
</script>
</body>
</html>
