<!doctype html>
<html lang="en" data-theme="day">
<head><meta charset="utf-8"><title>Button — Cozy Game World</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../tokens/tokens.css">
<link rel="stylesheet" href="../bundle.css">
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="../bundle.js"></script>
</head>
<body>
<!-- Standalone example of the Button component. Change data-theme on <html> to dusk or night to see the other themes. -->
<div id="root" class="cz-row"></div>
<script>
  var C = window.Cozy, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null, h(C.Button, { icon: 'map' }, 'Explore'), h(C.Button, { variant: 'secondary' }, 'Inspect'), h(C.Button, { variant: 'ghost', iconAfter: 'arrow' }, 'Skip'), h(C.Button, { variant: 'danger' }, 'Reset progress'), h(C.Button, { 'data-state': 'pressed' }, 'Pressed'), h(C.Button, { size: 'sm' }, 'Small'), h(C.Button, { loading: true }, 'Sending'), h(C.Button, { disabled: true }, 'Locked')));
</script>
</body>
</html>
