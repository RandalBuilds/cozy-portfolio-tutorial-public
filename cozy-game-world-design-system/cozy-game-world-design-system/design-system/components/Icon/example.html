<!doctype html>
<html lang="en" data-theme="day">
<head><meta charset="utf-8"><title>Icon — Cozy Game World</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../tokens/tokens.css">
<link rel="stylesheet" href="../bundle.css">
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="../bundle.js"></script>
</head>
<body>
<!-- Standalone example of the Icon component. Change data-theme on <html> to dusk or night to see the other themes. -->
<div id="root" class="cz-row"></div>
<script>
  var C = window.Cozy, h = React.createElement;
  var names = C.Icon.names;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null, names.map(function (n) { return h('div', { key: n, style: { display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 4, width: 72, font: '600 12px var(--font-sans)', color: 'var(--ink-soft)' } }, h(C.Icon, { name: n, size: 32, style: { color: 'var(--ink)' } }), n); })));
</script>
</body>
</html>
