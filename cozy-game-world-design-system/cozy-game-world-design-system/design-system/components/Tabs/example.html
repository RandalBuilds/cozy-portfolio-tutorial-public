<!doctype html>
<html lang="en" data-theme="day">
<head><meta charset="utf-8"><title>Tabs — Cozy Game World</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../tokens/tokens.css">
<link rel="stylesheet" href="../bundle.css">
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="../bundle.js"></script>

<body>
<!-- Standalone example of the Tabs component. Change data-theme on <html> to dusk or night to see the other themes. -->
<div id="root" class="cz-row"></div>
<script>
  var C = window.Cozy, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(C.Tabs, { label: 'Character sheet', tabs: [{ id: 'about', label: 'About', content: 'Maker of tiny cozy tools.' }, { id: 'skills', label: 'Skills', content: 'React, n8n, WordPress.' }, { id: 'inv', label: 'Inventory', content: '12 items collected.' }] }));
</script>
</body>
